{% extends "base.html" %}
{% block title %}دسترسی غیرمجاز | سامانه حضور و غیاب{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-sm mt-4">
                <div class="card-body text-center p-5">
                    <div class="display-1 fw-bold text-danger">403</div>

                    <div class="mb-3">
                        <i class="bi bi-shield-lock display-4 text-danger"></i>
                    </div>

                    <h1 class="fw-bold mb-3">دسترسی غیرمجاز</h1>

                    <p class="text-muted mb-1">
                        متأسفانه شما مجوز مشاهده این صفحه را ندارید.
                    </p>
                    <p class="text-muted">
                        اگر فکر می‌کنید این دسترسی باید برای شما فعال باشد،
                        با مدیر سیستم تماس بگیرید.
                    </p>

                    <div class="d-flex gap-2 justify-content-center flex-wrap mt-4">
                        <a href="/dashboard" class="btn btn-primary rounded-pill px-4">
                            <i class="bi bi-house-door"></i> بازگشت به داشبورد
                        </a>
                        <button type="button" onclick="history.back()"
                                class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="bi bi-arrow-right"></i> بازگشت به صفحه قبل
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
