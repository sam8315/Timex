<!-- unified filter area -->
<div class="card mb-4">
    <div class="card-body">
        <form method="get" action="/admin/attendance" class="row g-3 align-items-end">
            <input type="hidden" name="date_str" value="{{ date_str_input }}">
            <div class="col-md-3">
                <label class="form-label">📅 تاریخ (شمسی)</label>
                <input type="text" name="date_str" class="form-control jalali-date"
                       id="attendanceDate" placeholder="انتخاب تاریخ"
                       autocomplete="off" value="{{ date_str_input }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">👤 کاربر</label>
                <div class="user-search-wrapper position-relative">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="userSearchInput"
                               placeholder="جستجو بر اساس نام، کد پرسنلی یا عضویت..."
                               autocomplete="off"
                               {% if selected_user_id %}value="{{ selected_user_name or '' }}"{% endif %}>
                        <button type="button" class="btn btn-outline-secondary" id="clearUserBtn"
                                style="display:{% if selected_user_id %}block{% else %}none{% endif %};">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <input type="hidden" name="user_id" id="targetUserId" value="{{ selected_user_id or '' }}">
                    <div class="user-search-results" id="userSearchResults"></div>
                    <div class="selected-user-info mt-2" id="selectedUserInfo" style="display:{% if selected_user_id %}block{% else %}none{% endif %};">
                        <div class="alert alert-success py-2 mb-0 d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-check-circle"></i> <strong id="selectedUserName">{{ selected_user_name or '' }}</strong>
                            <small class="text-muted ms-2" id="selectedUserDept">({{ selected_user_id or '' }})</small></span>
                            <button type="button" class="btn btn-sm btn-outline-danger" id="removeUserBtn"><i class="bi bi-x"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label">🏢 دپارتمان</label>
                <select name="department" class="form-select">
                    <option value="">همه دپارتمان‌ها</option>
                    <option value="1" {% if department == '1' %}selected{% endif %}>رسمی</option>
                    <option value="2" {% if department == '2' %}selected{% endif %}>وظیفه</option>
                    <option value="3" {% if department == '3' %}selected{% endif %}>خریدخدمت</option>
                    <option value="4" {% if department == '4' %}selected{% endif %}>قراردادی</option>
                    <option value="5" {% if department == '5' %}selected{% endif %}>پزشک</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> اعمال فیلتر</button>
            </div>
        </form>
    </div>
</div>
