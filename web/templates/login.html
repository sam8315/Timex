{% extends "base.html" %}
{% block title %}ورود | Timex{% endblock %}
{% block content_full %}
<div class="auth-shell">
    <div class="card auth-card">
        <div class="card-body">
            <div class="auth-brand">
                <div class="auth-logo" aria-hidden="true">
                    <i class="bi bi-clock-history"></i>
                </div>
                <div class="auth-brand-name">Timex</div>
                <h1 class="auth-title">سامانه حضور و غیاب</h1>
                <p class="auth-subtitle">لطفاً وارد حساب کاربری خود شوید</p>
            </div>

            {% if msg %}
            <div class="alert alert-success" role="alert">{{ msg }}</div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="national_code">کد ملی</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="national_code" id="national_code"
                               class="form-control ltr-text"
                               required maxlength="10" autofocus
                               inputmode="numeric"
                               autocomplete="username"
                               oninput="this.value=this.value.replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660).replace(/[^0-9]/g,'').slice(0,10)">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">رمز عبور</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="password"
                               class="form-control"
                               required autocomplete="current-password"
                               placeholder="رمز عبور">
                        <button type="button" class="input-group-text auth-toggle-password"
                                id="togglePassword" aria-label="نمایش رمز عبور"
                                title="نمایش / مخفی کردن رمز">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-auth">
                    <i class="bi bi-box-arrow-in-right"></i> ورود
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/forgot-password" class="auth-link">رمز عبور را فراموش کرده‌اید؟</a>
            </div>
        </div>
    </div>
</div>
<script>
    (function () {
        var btn = document.getElementById('togglePassword');
        var input = document.getElementById('password');
        var icon = document.getElementById('togglePasswordIcon');
        if (!btn || !input || !icon) return;
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            btn.setAttribute('aria-label', show ? 'مخفی کردن رمز عبور' : 'نمایش رمز عبور');
        });
    })();
</script>
{% endblock %}
