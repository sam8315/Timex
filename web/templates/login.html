{% extends "base.html" %}
{% block title %}ورود | سامانه حضور و غیاب{% endblock %}
{% block content_full %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
    <div class="card shadow-lg" style="width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-clock-history display-4 text-primary"></i>
                <h3 class="mt-2">سامانه حضور و غیاب</h3>
                <p class="text-muted">لطفاً وارد حساب کاربری خود شوید</p>
            </div>
            {% if msg %}
            <div class="alert alert-success" role="alert">
                {{ msg }}
            </div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">کد ملی</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="national_code" class="form-control"
                               required maxlength="10"
                               oninput="this.value=this.value.replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660).replace(/[^0-9]/g,'').slice(0,10)">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">رمز عبور</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>
                 <button type="submit" class="btn btn-primary w-100">
                     <i class="bi bi-box-arrow-in-right"></i> ورود
                 </button>
             </form>
             <div class="text-center mt-3">
                 <a href="/forgot-password" class="text-decoration-none">رمز عبور را فراموش کرده‌اید؟</a>
             </div>
        </div>
    </div>
</div>
{% endblock %}
