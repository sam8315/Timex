{% extends "base.html" %}
{% block title %}تعیین رمز عبور جدید | Timex{% endblock %}
{% block content_full %}
<div class="auth-shell">
    <div class="card auth-card">
        <div class="card-body">
            <div class="auth-brand">
                <div class="auth-logo" aria-hidden="true">
                    <i class="bi bi-key-fill"></i>
                </div>
                <div class="auth-brand-name">Timex</div>
                <h1 class="auth-title">تعیین رمز عبور جدید</h1>
                <p class="auth-subtitle">رمز عبور جدید خود را وارد کنید</p>
            </div>

            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="/reset-password" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="new_password">رمز عبور جدید</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="new_password" id="new_password"
                               class="form-control"
                               required minlength="6" autofocus
                               autocomplete="new-password"
                               placeholder="حداقل ۶ کاراکتر">
                        <button type="button" class="input-group-text auth-toggle-password"
                                data-toggle-for="new_password" aria-label="نمایش رمز عبور"
                                title="نمایش / مخفی کردن رمز">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <small class="text-muted">حداقل ۶ کاراکتر</small>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirm_password">تکرار رمز عبور جدید</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="confirm_password" id="confirm_password"
                               class="form-control"
                               required minlength="6"
                               autocomplete="new-password"
                               placeholder="تکرار رمز عبور">
                        <button type="button" class="input-group-text auth-toggle-password"
                                data-toggle-for="confirm_password" aria-label="نمایش رمز عبور"
                                title="نمایش / مخفی کردن رمز">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-auth">
                    <i class="bi bi-save"></i> ذخیره رمز عبور
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="auth-link">بازگشت به صفحه ورود</a>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.auth-toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.getAttribute('data-toggle-for'));
            var icon = btn.querySelector('i');
            if (!input || !icon) return;
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            btn.setAttribute('aria-label', show ? 'مخفی کردن رمز عبور' : 'نمایش رمز عبور');
        });
    });
</script>
{% endblock %}
