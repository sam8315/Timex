{% extends "base.html" %}
{% block title %}تعیین رمز عبور جدید | سامانه حضور و غیاب{% endblock %}
{% block content_full %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
    <div class="card shadow-lg" style="width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill display-4 text-primary"></i>
                <h3 class="mt-2">تعیین رمز عبور جدید</h3>
                <p class="text-muted">رمز عبور جدید خود را وارد کنید</p>
            </div>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="/reset-password">
                <div class="mb-3">
                    <label class="form-label">رمز عبور جدید</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="new_password" class="form-control" required minlength="6" autofocus>
                    </div>
                    <small class="text-muted">حداقل ۶ کاراکتر</small>
                </div>
                <div class="mb-4">
                    <label class="form-label">تکرار رمز عبور جدید</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="confirm_password" class="form-control" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-save"></i> ذخیره رمز عبور
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none">بازگشت به صفحه ورود</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
