{% extends "base.html" %}
{% block title %}فیش حقوقی {{ period_label }}{% endblock %}
{% block content %}
<style>
@media print {
    .app-sidebar, .app-topbar, .navbar, .no-print, .sidebar-overlay { display: none !important; }
    .app-main, .app-content, .container, .content {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
        min-height: 0 !important;
        animation: none !important;
    }
    body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
}
</style>

<div class="d-flex justify-content-between align-items-center mb-3 no-print">
    <a href="{{ back_url }}" class="btn btn-outline-secondary btn-sm">بازگشت</a>
    <div class="d-flex gap-2">
        <button class="btn btn-primary btn-sm" onclick="window.print()">چاپ</button>
        <a class="btn btn-outline-primary btn-sm" href="{{ pdf_url }}">PDF</a>
    </div>
</div>

{% include "payroll/_payslip_body.html" %}
{% endblock %}
{% block extra_js %}
<script src="/static/js/payslip_print.js"></script>
{% endblock %}
