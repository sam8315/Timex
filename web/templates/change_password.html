{% extends "base.html" %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block content_full %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
    <div class="card shadow-lg" style="width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock display-4 text-warning"></i>
                <h3 class="mt-2">تغییر رمز عبور</h3>
                <p class="text-muted">برای امنیت بیشتر، رمز عبور خود را تغییر دهید</p>
            </div>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            <script>setTimeout(() => window.location.href = '/dashboard', 2000);</script>
            {% else %}
            <form method="post" action="/change-password">
                <div class="mb-3">
                    <label class="form-label">رمز عبور فعلی</label>
                    <input type="password" name="current_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">رمز عبور جدید</label>
                    <input type="password" name="new_password" class="form-control" required minlength="6">
                </div>
                <div class="mb-4">
                    <label class="form-label">تکرار رمز عبور جدید</label>
                    <input type="password" name="confirm_password" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-warning w-100">
                    <i class="bi bi-key"></i> تغییر رمز عبور
                </button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
